<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Codex Pet Limit Rings app icon</title>
  <desc id="desc">Dark rounded-square icon with green and blue usage rings around a compact center badge.</desc>
  <defs>
    <linearGradient id="bg" x1="160" y1="120" x2="864" y2="904" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#070913"/>
      <stop offset="1" stop-color="#142038"/>
    </linearGradient>
    <filter id="greenGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blueGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="17" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="82" y="82" width="860" height="860" rx="210" fill="url(#bg)"/>
  <rect x="105" y="105" width="814" height="814" rx="188" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="10"/>
  <path d="M512 186a326 326 0 1 1-290 475" fill="none" stroke="#2bf5cc" stroke-width="72" stroke-linecap="round" filter="url(#greenGlow)"/>
  <path d="M512 292a220 220 0 0 1 214 270" fill="none" stroke="#6bbaff" stroke-width="50" stroke-linecap="round" filter="url(#blueGlow)"/>
  <rect x="327" y="358" width="370" height="308" rx="70" fill="#040811" fill-opacity="0.82"/>
  <rect x="380" y="526" width="264" height="32" rx="16" fill="#2bf5cc"/>
  <rect x="410" y="442" width="204" height="24" rx="12" fill="#6bbaff"/>
</svg>
